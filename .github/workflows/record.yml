name: 성과 기록
on:
  workflow_dispatch:
    inputs:
      id:
        description: "영상 ID (메일 맨 아래에 있음)"
        required: true
      views:
        description: "조회수"
        required: true
permissions:
  contents: write
concurrency: state
jobs:
  record:
    runs-on: ubuntu-latest
    env:
      VIDEO_ID: ${{ inputs.id }}
      VIEWS: ${{ inputs.views }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pyyaml requests pillow
      - run: python -m pipeline.run record --id "$VIDEO_ID" --views "$VIEWS"
      - run: |
          git config user.name "shortform-autopilot" && git config user.email "actions@users.noreply.github.com"
          git add state && git commit -m "state: record" || exit 0
          git pull --rebase && git push
