name: 성과 수집
on:
  schedule:
    - cron: "0 0 * * 0"   # 일요일 09:00 KST
  workflow_dispatch:
permissions:
  contents: write
concurrency: state
jobs:
  metrics:
    runs-on: ubuntu-latest
    env:
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_BASE: ${{ vars.IG_API_BASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pyyaml requests pillow
      - run: python -m pipeline.run metrics
      - run: |
          git config user.name "shortform-autopilot" && git config user.email "actions@users.noreply.github.com"
          git add state && git commit -m "state: metrics" || exit 0
          git pull --rebase && git push
