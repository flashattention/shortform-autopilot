name: 승인된 영상 게시
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
permissions:
  contents: write
  issues: write
concurrency: publish-${{ github.event.issue.number }}
jobs:
  publish:
    # 레포 주인이 승인·반려했을 때만 실행
    if: >-
      github.event.sender.login == github.repository_owner && !github.event.issue.pull_request && (
        (github.event_name == 'issues' && (github.event.label.name == 'approve' || github.event.label.name == 'reject')) ||
        (github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/approve') || startsWith(github.event.comment.body, '/reject')))
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_API_BASE: ${{ vars.IG_API_BASE }}
      IG_UPLOAD_MODE: ${{ vars.IG_UPLOAD_MODE }}
      REJECT: ${{ (github.event.label.name == 'reject' || startsWith(github.event.comment.body, '/reject')) && '--reject' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install pyyaml requests pillow
      - run: python -m pipeline.run publish --issue ${{ github.event.issue.number }} $REJECT
      - name: 실패 알림
        if: failure()
        run: gh issue comment ${{ github.event.issue.number }} --body "게시에 실패했습니다. Actions 로그를 확인한 뒤 \`/approve\` 로 다시 시도하세요."
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "shortform-autopilot" && git config user.email "actions@users.noreply.github.com"
          git add state && git commit -m "state: publish" || exit 0
          git pull --rebase && git push
