name: 영상 만들기
on:
  schedule:
    - cron: "0 9 * * 1,3,5"   # 월·수·금 18:00 KST
  workflow_dispatch:
    inputs:
      account:
        description: "계정 (비우면 둘 다)"
        type: choice
        options: ["", kr, global]
permissions:
  contents: write
  issues: write
concurrency: state
jobs:
  produce:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: 라벨 준비
        run: |
          for l in review approve reject kr global; do gh label create "$l" --force; done
      - name: 기획 → 녹화 → 편집 → 검수 이슈
        run: python -m pipeline.run produce ${{ inputs.account && format('--account {0}', inputs.account) || '' }}
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "shortform-autopilot" && git config user.email "actions@users.noreply.github.com"
          git add state && git commit -m "state: produce" || exit 0
          git pull --rebase && git push
