name: 영상 만들기
on:
  schedule:
    - cron: "17 21 * * *"   # 매일 06:17 KST
  workflow_dispatch:
    inputs:
      product:
        description: "이 제품만 만들기 (비우면 전부)"
        type: choice
        options: ["", dream-runner, jelly-seoul-runner, capyzombie, latent-atlas, mouse-father]
permissions:
  contents: write
concurrency: state
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - run: pip install -r requirements.txt && playwright install --with-deps chromium
      - name: 기획 → 녹화 → 편집 → 메일
        run: python -m pipeline.run produce ${{ inputs.product && format('--product {0}', inputs.product) || '' }}
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "shortform-autopilot" && git config user.email "actions@users.noreply.github.com"
          git add state && git commit -m "state: produce" || exit 0
          git pull --rebase && git push
