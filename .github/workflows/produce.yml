name: 영상 만들기
# 드림 러너 · 카피좀비 · Latent Atlas. 아침에 3번, 저녁에 6번 이어서 돈다.
on:
  schedule:
    - cron: "17 21 * * *"   # 06:17 KST 아침 — 3번 연속
    - cron: "17 8 * * *"    # 17:17 KST 저녁 — 6번 연속
  workflow_dispatch:
    inputs:
      product:
        description: "만들 제품"
        type: choice
        default: all
        options: [all, dream-runner, capyzombie, latent-atlas]
      rounds:
        description: "이번을 포함해 몇 번 이어서 돌릴지"
        default: "1"
permissions:
  contents: write
  actions: write
concurrency:
  group: produce
  cancel-in-progress: false
jobs:
  run:
    uses: ./.github/workflows/_produce-core.yml
    with:
      group: main
      product: ${{ inputs.product || 'all' }}
      rounds: ${{ inputs.rounds || '' }}
      caller: produce.yml
    secrets: inherit
