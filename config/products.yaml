  latent-atlas:
    name: {ko: Latent Atlas, en: Latent Atlas}
    about: {ko: "머신러닝·딥러닝·LLM 개념을 돌려볼 수 있는 3D 그림으로 설명하는 무료 학습 사이트", en: "A free site that explains ML, deep learning and LLM concepts with 3D figures you can rotate"}
    url: "https://latent-atlas-pied.vercel.app/"
    link_text: {ko: "프로필 링크에서 무료로 보기", en: "Free, link in bio"}
    formats: [concept_30s, quiz_poll, question_hook]
    hooks:
      ko: ["어텐션, 3D로 돌려보면 10초 만에 이해됨", "면접에서 이거 물어보면 그림으로 답하세요", "글로 읽으면 3시간, 돌려보면 30초", "딥러닝 개념을 손으로 돌려보는 사이트", "임베딩이 뭔지 아직도 헷갈린다면"]
      en: ["Attention finally clicked when I could rotate it", "Read it for 3 hours or spin it for 30 seconds", "ML concepts you can turn with your hand", "Still fuzzy on embeddings?"]
    cta: {ko: "저장해두고 면접 전에 다시 보기", en: "Save this for your next ML interview"}
    comment_ask: "다음에 보고 싶은 개념을 댓글로 남겨주세요"
    hashtags:
      ko: [딥러닝, 머신러닝, AI공부, 개발자, 취준]
      en: [machinelearning, deeplearning, llm, aiengineering, learnai]
    capture:
      i18n: true
      trim_start: 0
      min_moving: 0.25         # 글이 많은 사이트라 화면 변화가 적다. 검수 기준을 낮춤
      setup:
        - {do: wait, ms: 2500}
      recipe:                  # 위쪽 3D 그림을 돌려 보고, 설명을 잠깐 내렸다가 돌아온다
        - {do: drag, from: [0.3, 0.2], to: [0.7, 0.22], ms: 1600}
        - {do: wait, ms: 400}
        - {do: drag, from: [0.65, 0.18], to: [0.35, 0.26], ms: 1400}
        - {do: scroll, dy: 260, ms: 1500}
        - {do: scroll, dy: -260, ms: 600}
      scenes:
        - {id: attention, url: "https://latent-atlas-pied.vercel.app/#attention", desc: {ko: "어텐션 메커니즘 (Attention Mechanism) 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Attention Mechanism"}}
        - {id: transformer, url: "https://latent-atlas-pied.vercel.app/#transformer", desc: {ko: "Transformer 블록 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Transformer Block"}}
        - {id: embedding, url: "https://latent-atlas-pied.vercel.app/#embedding", desc: {ko: "임베딩 레이어 (Embedding Layer) 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Embedding Layer"}}
        - {id: backprop, url: "https://latent-atlas-pied.vercel.app/#backprop", desc: {ko: "역전파 (Backpropagation) 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Backpropagation"}}
        - {id: gd, url: "https://latent-atlas-pied.vercel.app/#gd", desc: {ko: "경사 하강법 (Gradient Descent) 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Gradient Descent"}}
        - {id: dropout, url: "https://latent-atlas-pied.vercel.app/#dropout", desc: {ko: "드롭아웃 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Dropout"}}
        - {id: lora, url: "https://latent-atlas-pied.vercel.app/#lora", desc: {ko: "LoRA (저랭크 적응) 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for LoRA"}}
        - {id: rag, url: "https://latent-atlas-pied.vercel.app/#rag", desc: {ko: "검색 증강 생성(Retrieval-Augmented Generation, RAG) 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Retrieval-Augmented Generation (RAG)"}}
        - {id: kvcache, url: "https://latent-atlas-pied.vercel.app/#kvcache", desc: {ko: "KV 캐시 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for KV Cache"}}
        - {id: softmax, url: "https://latent-atlas-pied.vercel.app/#softmax", desc: {ko: "소프트맥스 (Softmax) 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Softmax"}}
        - {id: tokenization, url: "https://latent-atlas-pied.vercel.app/#tokenization", desc: {ko: "토큰화 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Tokenization"}}
        - {id: overfit, url: "https://latent-atlas-pied.vercel.app/#overfit", desc: {ko: "과적합 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Overfitting"}}
        - {id: batchnorm, url: "https://latent-atlas-pied.vercel.app/#batchnorm", desc: {ko: "배치 정규화 개념을 3D 그림으로 돌려보는 화면", en: "rotating the 3D figure for Batch Normalization"}}
