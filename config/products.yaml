# 제품·장면 설정. 여기만 고치면 파이프라인 전체가 따라갑니다.

# 언어별 계정과 올릴 곳
langs:
  ko: {account: kr, platforms: [instagram, shorts]}
  en: {account: global, platforms: [tiktok, shorts]}

# 한 번 실행할 때 제품마다 고르는 장면 수. 장면 하나로 한국어 1편 + 영어 1편을 만듭니다 → 제품당 4편
scenes_per_product: 2

products:
  dream-runner:
    name: {ko: 드림 러너, en: Dream Runner}
    about: {ko: "곰돌이가 꿈속을 달리는 3D 러너. 혼자 만들었고 토스 미니앱과 웹에서 무료", en: "A 3D endless runner where a jelly bear runs through dreams. Solo-made, free in the browser"}
    url: "https://jelly-city.fly.dev/dream-runner"
    link_text: {ko: "토스 앱에서 '드림 러너' 검색", en: "Free in browser, link in bio"}
    formats: [kr_relatable, question_hook, loop_satisfying, devlog_day, quiz_poll]
    hooks:
      ko: ["30초 넘기기 은근 어렵다", "자기 전에 한 판만 하려다 새벽 됨", "혼자 만든 게임이 토스에 들어갔다", "젤리곰이 꿈속에서 도망치는 이유", "동기 20명이 제일 재밌다고 한 게임"]
      en: ["This dream changes every 20 seconds", "Can you last 30 seconds?", "I made a runner where the whole world swaps mid-run", "One more run turned into 3am"]
    cta: {ko: "토스에서 '드림 러너' 검색", en: "Play free in your browser"}
    comment_ask: "몇 초까지 버텼는지 댓글로 알려주세요"
    hashtags:
      ko: [드림러너, 인디게임, 1인개발, 토스미니앱, 러너게임]
      en: [indiegame, gamedev, indiedev, endlessrunner, webgame]
    capture:
      trim_start: 3            # 시작 카운트다운
      # 봇 플레이가 운영 서버에 계정·기록·판수 통계를 남기지 않게 막는 요청
      block: ["**/api/login", "**/api/dream/run", "**/api/dream/score", "**/api/dream/played"]
      recipe:
        - {do: click, sel: "#again-btn", if_visible: true, ms: 400}   # 쓰러져서 결과 화면이 뜨면 다시 달리기
        - {do: random_keys, keys: [Space, ArrowLeft, ArrowRight, ArrowDown, Space], count: 4, gap_ms: [200, 700]}
      scenes:
        - id: dream
          desc: {ko: "꿈나라 맵: 하늘에 뜬 발판, 20초마다 꿈이 통째로 바뀜", en: "Dreamland map: floating platforms, the dream changes every 20 seconds"}
          setup:
            - {do: click, sel: "#guest-btn", ms: 1500}
            - {do: click, sel: "#map-pick button[data-m=dream]", ms: 500}
            - {do: click, sel: "#solo-btn", ms: 1500}
        - id: hell
          desc: {ko: "지옥 맵: 용암 위의 길", en: "Hell map: a path over lava"}
          setup:
            - {do: click, sel: "#guest-btn", ms: 1500}
            - {do: click, sel: "#map-pick button[data-m=hell]", ms: 500}
            - {do: click, sel: "#solo-btn", ms: 1500}
        - id: void
          desc: {ko: "이공간 맵: 공간마다 규칙이 하나씩 뒤틀림", en: "Void map: each space bends one rule"}
          setup:
            - {do: click, sel: "#guest-btn", ms: 1500}
            - {do: click, sel: "#map-pick button[data-m=void]", ms: 500}
            - {do: click, sel: "#solo-btn", ms: 1500}
        - id: seoul
          desc: {ko: "서울 코스 맵: 실제 서울 거리에서 차와 행인을 피함", en: "Seoul course map: dodging cars and people on real Seoul streets"}
          setup:
            - {do: click, sel: "#guest-btn", ms: 1500}
            - {do: click, sel: "#map-pick button[data-m=seoul]", ms: 500}
            - {do: click, sel: "#solo-btn", ms: 1500}
        - id: time
          desc: {ko: "모든 것의 역사 맵: 빅뱅부터 시대를 이어 달림", en: "History of Everything map: running through eras from the Big Bang"}
          setup:
            - {do: click, sel: "#guest-btn", ms: 1500}
            - {do: click, sel: "#map-pick button[data-m=time]", ms: 500}
            - {do: click, sel: "#solo-btn", ms: 1500}

