<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숏폼 파이프라인</title>
<style>
  :root{
    --bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--sub:#6b6a66;--line:#e6e4de;
    --run:#2563eb;--ok:#15803d;--bad:#c2410c;--wait:#8a8780;--warn:#b45309;--btn:#1d1d1b;--btnink:#fff;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#141413;--card:#1e1e1c;--ink:#ecebe7;--sub:#9c9a94;--line:#2e2d2a;--run:#60a5fa;--ok:#4ade80;--bad:#fb923c;--wait:#8a8780;--warn:#fbbf24;--btn:#ecebe7;--btnink:#141413}
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}
  .topbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;align-items:center;gap:10px;padding:14px 0 12px;margin-bottom:6px;border-bottom:1px solid var(--line)}
  h1{font-size:20px;margin:0;letter-spacing:-.02em;flex:1;min-width:0}
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--sub);letter-spacing:0}
  .all{display:flex;gap:6px;align-items:center}
  select,button{font:inherit;color:inherit}
  select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 8px;height:40px}
  .btn{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;height:40px;padding:0 14px;font-weight:600;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.sm{height:34px;padding:0 12px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .meta{color:var(--sub);font-size:13px}
  .sched{margin:10px 0 14px}
  .run{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;font-size:14px}
  .run{flex-direction:column;align-items:stretch;gap:8px}
  .runrow{display:flex;flex-wrap:wrap;gap:4px 18px;align-items:center}
  .runrow .btn{margin-left:auto}
  .runrow+.runrow{border-top:1px solid var(--line);padding-top:8px}
  .run b{font-weight:600}
  .run a{color:inherit}
  .notice{background:var(--card);border:1px dashed var(--warn);color:var(--warn);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:9px}
  .top{display:flex;align-items:center;gap:8px}
  .name{font-weight:650;font-size:16px;flex:1;min-width:0}
  .badge{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
  .s-run{color:var(--run)} .s-ok{color:var(--ok)} .s-bad{color:var(--bad)} .s-wait{color:var(--wait)} .s-warn{color:var(--warn)}
  .stage{font-size:19px;font-weight:650;letter-spacing:-.01em;word-break:keep-all}
  .detail{color:var(--sub);font-size:13px;min-height:20px;word-break:break-all}
  .bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--run);width:0;transition:width .6s}
  .nums{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--sub);align-items:center}
  .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
  .nums a{margin-left:auto;color:inherit}
  details{border-top:1px solid var(--line);padding-top:6px}
  summary{cursor:pointer;font-size:13px;color:var(--sub);padding:4px 0;list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::before{content:'▸ ';}
  details[open] summary::before{content:'▾ ';}
  .log{margin:0;padding:0;list-style:none;font-size:12.5px;color:var(--sub);max-height:190px;overflow:auto}
  .log li{display:flex;gap:8px;padding:2px 0}
  .log time{font-variant-numeric:tabular-nums;flex:none;width:42px}
  .log .st{color:var(--ink);flex:none}
  .log .bad{color:var(--bad)}
  h2{font-size:16px;margin:26px 0 10px}
  .videos{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 16px}
  .videos div{display:grid;grid-template-columns:90px 140px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .videos div:last-child{border:0}
  .videos time,.videos .p{color:var(--sub);font-size:13px;font-variant-numeric:tabular-nums}
  .empty{color:var(--sub);font-size:13px;padding:12px 0}
  dialog{border:0;border-radius:16px;padding:20px;background:var(--card);color:var(--ink);width:min(420px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.25)}
  dialog::backdrop{background:rgba(0,0,0,.4)}
  dialog h3{margin:0 0 6px;font-size:18px}
  dialog p{margin:0 0 14px;color:var(--sub);font-size:14px}
  dialog input[type=password]{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;font:inherit;background:var(--bg);color:var(--ink)}
  dialog label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--sub);margin:10px 0 16px}
  dialog .row{display:flex;gap:8px;justify-content:flex-end}
  dialog .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--btn);color:var(--btnink);
    padding:12px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:720px){
    body{font-size:14px}
    .wrap{padding:0 14px calc(40px + env(safe-area-inset-bottom))}
    .topbar{flex-wrap:wrap;padding:12px 0 10px}
    h1{font-size:18px;flex-basis:100%}
    .all{flex:1}
    .all .btn{flex:1}
    .grid{grid-template-columns:1fr;gap:10px}
    .card{padding:14px}
    .stage{font-size:17px}
    .run{padding:12px 14px;gap:4px 14px;font-size:13px}
    .videos div{grid-template-columns:1fr;gap:2px}
    .videos div span:last-child{font-size:14px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>숏폼 파이프라인<small id="fresh">불러오는 중…</small></h1>
    <div class="all">
      <select id="rounds" aria-label="이어서 돌릴 횟수"><option value="1">1번</option><option value="3">3번</option><option value="6">6번</option></select>
      <button class="btn" id="runAll" type="button">전체 실행</button>
    </div>
  </div>
  <div class="meta sched" id="sched"></div>
  <div id="notice"></div>
  <div class="run" id="run"></div>
  <div class="grid" id="grid"></div>
  <h2>최근 보낸 영상</h2>
  <div class="videos" id="videos"><div class="empty">아직 없습니다</div></div>
</div>
<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle">실행할까요?</h3>
    <p id="dlgText"></p>
    <input type="password" id="pw" placeholder="대시보드 비밀번호" autocomplete="current-password" required>
    <div class="err" id="dlgErr"></div>
    <label><input type="checkbox" id="remember" checked> 이 기기에서 비밀번호 기억하기</label>
    <div class="row">
      <button class="btn ghost" value="cancel" formnovalidate type="submit">취소</button>
      <button class="btn" id="dlgGo" value="go" type="submit">실행</button>
    </div>
  </form>
</dialog>
<div class="toast" id="toast"></div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = (t) => new Date(t).toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Seoul'});
const wide = () => matchMedia('(min-width: 721px)').matches;
const openLogs = new Set();
const mdhm = (t) => new Date(t).toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit', hour12:false, timeZone:'Asia/Seoul'});
function ago(ms){ const s=Math.max(0,Math.round(ms/1000)); if(s<60) return s+'초 전'; const m=Math.round(s/60); if(m<60) return m+'분 전'; return Math.round(m/60)+'시간 전'; }

const JOB_KO = {queued:'대기 중', in_progress:'진행 중', waiting:'대기 중', pending:'대기 중', requested:'대기 중'};
const CONC_KO = {success:'끝남', failure:'실패', cancelled:'취소됨', skipped:'건너뜀', timed_out:'시간 초과'};
const EVENT_KO = {schedule:'예약 실행', workflow_dispatch:'직접 실행', push:'코드 올림'};

function nextSchedule(now){
  // 06:17 (3번 연속), 17:17 (6번 연속) KST. GitHub 사정으로 늦게 시작할 수 있다
  const kst = new Date(now + 9*3600e3);
  const slots = [[6,17,'아침 3번 연속'],[17,17,'저녁 6번 연속']];
  for (let d=0; d<2; d++) for (const [h,m,label] of slots){
    const t = Date.UTC(kst.getUTCFullYear(), kst.getUTCMonth(), kst.getUTCDate()+d, h, m) - 9*3600e3;
    if (t > now) return {t, label};
  }
}

function jobFor(gh, product){
  return (gh.jobs || []).find((j) => j.name === `produce (${product})` || j.name.endsWith(`(${product})`));
}

function badge(job, last, now, runActive){
  if (job){
    if (job.status !== 'completed'){
      if (job.status === 'in_progress' && last && now - last.ts > 12*60e3 && last.stage !== '끝')
        return ['s-warn', `응답 없음 ${ago(now-last.ts).replace(' 전','')}`];
      return [job.status === 'in_progress' ? 's-run' : 's-wait', JOB_KO[job.status] || job.status];
    }
    return [job.conclusion === 'success' ? 's-ok' : 's-bad', CONC_KO[job.conclusion] || job.conclusion];
  }
  return ['s-wait', runActive ? '시작 전' : '쉬는 중'];
}

function card(id, p, gh, now){
  const last = p.last, job = jobFor(gh, id);
  const heavy = (lastData?.heavy || []).includes(id);
  const grpRun = (gh.runs || {})[heavy ? 'heavy' : 'main'] || null;
  const runActive = grpRun && grpRun.status !== 'completed';
  const [cls, label] = badge(job, last, now, runActive);
  const sameRun = last && grpRun && String(last.run_id) === String(grpRun.id);
  let stage = '기록 없음', detail = '', pct = null;
  if (last){
    stage = last.stage || '';
    detail = [last.scene && `${last.scene}`, last.lang && (last.lang === 'ko' ? '한국어' : '영어'), last.detail].filter(Boolean).join(' · ');
    if (last.frames) pct = Math.min(100, Math.round(100 * (last.frame || 0) / last.frames));
    else if (last.total && last.done != null) pct = Math.min(100, Math.round(100 * last.done / last.total));
    if (!sameRun && grpRun) detail = `지난 실행 · ${detail}`;
  }
  if (job && job.status === 'queued') { stage = '차례를 기다리는 중'; detail = 'GitHub 서버가 배정되면 시작합니다'; pct = null; }
  else if (job && job.status === 'in_progress' && !sameRun) { stage = job.step || '진행 중'; detail = '이번 실행의 세부 진행 상황은 아직 받지 못했어요'; pct = null; }
  const logs = (p.log || []).map((e) => `<li><time>${hm(e.ts)}</time><span class="st">${esc(e.stage)}</span><span class="${e.stage==='제외'||e.stage==='중단'?'bad':''}">${esc([e.scene, e.lang, e.detail].filter(Boolean).join(' · '))}</span></li>`).join('');
  const running = job && job.status !== 'completed';
  const open = openLogs.has(id) || (wide() && !openLogs.has('!' + id));
  return `<div class="card">
    <div class="top"><span class="name">${esc(p.name)}${heavy ? ' <small class="meta" title="녹화가 오래 걸려 따로 도는 파이프라인">· 무거운 게임</small>' : ''}</span><span class="badge ${cls}">${esc(label)}</span>
      <button class="btn sm ghost" type="button" data-run="${esc(id)}" ${canRun && !running ? '' : 'disabled'} title="${running ? '이 제품은 지금 만드는 중이에요' : canRun ? '이 제품만 1번 실행' : '실행 버튼 설정이 필요해요'}">실행</button></div>
    <div class="stage">${esc(stage)}</div>
    <div class="detail">${esc(detail)}${last ? ` <span title="${esc(mdhm(last.ts))}">· ${ago(now - last.ts)}</span>` : ''}</div>
    <div class="bar" style="visibility:${pct==null?'hidden':'visible'}"><i style="width:${pct||0}%"></i></div>
    <div class="nums"><span>보냄 <b>${sameRun ? (last.sent ?? 0) : 0}</b></span><span>제외 <b>${sameRun ? (last.failed ?? 0) : 0}</b></span><span>예정 <b>${sameRun ? (last.total ?? '-') : '-'}</b></span>${job && job.url ? `<a href="${esc(job.url)}" target="_blank" rel="noopener">로그</a>` : ''}</div>
    <details data-log="${esc(id)}" ${open ? 'open' : ''}><summary>최근 기록 ${(p.log || []).length}개</summary><ul class="log">${logs || '<li>아직 기록이 없습니다</li>'}</ul></details>
  </div>`;
}

let canRun = false, pending = null;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('show'), 4200); }
function savedPw(){ try { return localStorage.getItem('dash.pw') || ''; } catch { return ''; } }
function askRun(product, rounds){
  const name = product === 'all' ? '기본 파이프라인 전체' : product === 'all-heavy' ? '무거운 게임 둘 다' : (lastData?.products?.[product]?.name || product);
  pending = {product, rounds};
  $('dlgTitle').textContent = `${name} ${rounds}번 실행할까요?`;
  $('dlgText').textContent = product === 'all'
    ? `드림 러너 · 카피좀비 · Latent Atlas 를 동시에 만들어요. 한 번에 메일이 12통쯤 와요.${rounds > 1 ? ` 끝나면 이어서 ${rounds - 1}번 더 돌아요.` : ''}`
    : product === 'all-heavy'
    ? '젤리 서울 러너와 쥐구멍에도 볕 들 날을 동시에 만들어요. 녹화가 오래 걸려요. 메일이 8통쯤 와요.'
    : '이 제품만 장면 2개 × 한국어·영어로 만들어요. 메일이 4통쯤 와요.';
  $('pw').value = savedPw(); $('dlgErr').textContent = '';
  $('dlg').showModal();
  if (!$('pw').value) $('pw').focus(); else $('dlgGo').focus();
}
$('dlgForm').addEventListener('submit', async (e) => {
  if (e.submitter?.value !== 'go') return;
  e.preventDefault();
  const pw = $('pw').value; if (!pw) return;
  $('dlgGo').disabled = true; $('dlgErr').textContent = '';
  try {
    const r = await fetch('/api/run', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({...pending, password: pw})});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (d.badPassword) { try { localStorage.removeItem('dash.pw'); } catch {} }
      $('dlgErr').textContent = d.error || `실패 (${r.status})`;
      return;
    }
    try { if ($('remember').checked) localStorage.setItem('dash.pw', pw); else localStorage.removeItem('dash.pw'); } catch {}
    $('dlg').close(); toast(d.message || '실행을 요청했어요');
    setTimeout(() => tick(true), 6000); setTimeout(() => tick(true), 20000);
  } catch { $('dlgErr').textContent = '연결 실패. 다시 눌러 주세요'; }
  finally { $('dlgGo').disabled = false; }
});
$('runAll').addEventListener('click', () => askRun('all', +$('rounds').value));
for (const host of ['grid', 'run']) $(host).addEventListener('click', (e) => { const b = e.target.closest('[data-run]'); if (b && !b.disabled) askRun(b.dataset.run, 1); });
$('grid').addEventListener('toggle', (e) => {
  const d = e.target; if (!d.dataset || !d.dataset.log) return;
  const id = d.dataset.log;
  if (d.open) { openLogs.add(id); openLogs.delete('!' + id); } else { openLogs.delete(id); openLogs.add('!' + id); }
}, true);

let lastData = null;
let lastOk = 0;
async function tick(fresh){
  let d;
  try {
    const r = await fetch('/api/status' + (fresh ? '?fresh=1' : ''), {cache:'no-store'});
    d = await r.json();
    lastData = d; canRun = !!d.canRun;
    lastOk = Date.now();
  } catch (e) {
    $('fresh').textContent = '연결 실패 · 다시 시도 중';
    return;
  }
  const now = d.now, gh = d.github || {};
  const n = nextSchedule(Date.now());
  $('sched').textContent = n ? `다음 예약 ${mdhm(n.t)} · ${n.label} (GitHub 사정으로 늦게 시작할 수 있어요)` : '';
  const notes = [];
  if (!d.store) notes.push('진행 상황 저장소(Upstash Redis)가 아직 연결되지 않아 GitHub 실행 상태만 보입니다. README 의 대시보드 설정을 확인하세요.');
  if (d.storeError) notes.push('저장소 오류: ' + d.storeError);
  if (gh.ok === false) notes.push('GitHub 상태를 못 읽었습니다: ' + gh.error);
  const active = gh.runs?.main && gh.runs.main.status !== 'completed';
  $('runAll').disabled = !canRun || active;
  $('runAll').title = !canRun ? '실행 버튼을 쓰려면 Vercel 에 DASHBOARD_PASSWORD 와 GITHUB_TOKEN 을 넣어 주세요' : active ? '지금 실행 중이에요. 끝나면 누를 수 있어요' : '';
  $('notice').innerHTML = notes.map((x) => `<div class="notice">${esc(x)}</div>`).join('');
  const runs = gh.runs || {};
  const rowFor = (label, c, group) => {
    if (!c) return `<div class="runrow"><b>${label}</b> · <span class="meta">실행 기록 없음</span>${group === 'heavy' ? heavyBtn(false) : ''}</div>`;
    const act = c.status !== 'completed';
    const st = act ? (JOB_KO[c.status] || c.status) : (CONC_KO[c.conclusion] || c.conclusion);
    return `<div class="runrow"><span><b>${label}</b> · <span class="${act?'s-run':c.conclusion==='success'?'s-ok':'s-bad'}">${esc(st)}</span></span>
      <span>${esc(EVENT_KO[c.event] || c.event)} · ${mdhm(c.created_at)} 시작</span>
      <span>${act ? '경과 ' + ago(now - Date.parse(c.created_at)).replace(' 전','') : '끝난 지 ' + ago(now - Date.parse(c.updated_at))}</span>
      <a href="${esc(c.url)}" target="_blank" rel="noopener">GitHub</a>${group === 'heavy' ? heavyBtn(act) : ''}</div>`;
  };
  const heavyBtn = (act) => `<button class="btn sm ghost" type="button" data-run="all-heavy" ${canRun && !act ? '' : 'disabled'}>둘 다 실행</button>`;
  $('run').innerHTML = rowFor('기본 파이프라인', runs.main, 'main') + rowFor('무거운 게임', runs.heavy, 'heavy');
  $('grid').innerHTML = Object.entries(d.products).map(([id, p]) => card(id, p, gh, now)).join('');
  $('videos').innerHTML = (d.videos || []).length ? d.videos.map((v) => `<div><time>${mdhm(v.ts)}</time><span class="p">${esc(d.products[v.product]?.name || v.product)} · ${v.lang==='ko'?'한국어':'영어'}</span><span>${esc(v.hook)}</span></div>`).join('') : '<div class="empty">아직 없습니다</div>';
  $('fresh').textContent = '방금 갱신';
}
setInterval(() => { if (lastOk) $('fresh').textContent = '마지막 갱신 ' + ago(Date.now() - lastOk); }, 1000);
tick();
setInterval(tick, 5000);
</script>
</body>
</html>
